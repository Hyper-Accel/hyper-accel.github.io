name: Check Hugo build

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/check-hugo-build.yml"
      - ".gitmodules"
      - "themes/PaperMod"
      - "hugo.yaml"
      - "content/**"
      - "layouts/**"
      - "assets/**"
      - "static/**"
      - "data/**"
      - "i18n/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build Hugo site
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo --minify --destination "${RUNNER_TEMP}/hugo-public"
          test -s "${RUNNER_TEMP}/hugo-public/index.html"
