name: Check post drafts

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check-post-drafts:
    name: Check changed posts are publishable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject draft posts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          checked=0
          failed=0

          while IFS= read -r file; do
            [[ -n "$file" && -f "$file" ]] || continue
            checked=$((checked + 1))

            draft_value="$(
              awk '
                NR == 1 && /^---[[:space:]]*$/ {
                  in_frontmatter = 1
                  next
                }
                in_frontmatter && /^---[[:space:]]*$/ {
                  exit
                }
                in_frontmatter && /^[[:space:]]*draft[[:space:]]*:/ {
                  value = $0
                  sub(/^[[:space:]]*draft[[:space:]]*:[[:space:]]*/, "", value)
                  sub(/[[:space:]]*#.*/, "", value)
                  gsub(/[[:space:]\047\"]/, "", value)
                  print tolower(value)
                  exit
                }
              ' "$file"
            )"

            if [[ "$draft_value" == "true" ]]; then
              echo "::error file=$file,title=Post is still a draft::Set 'draft: false' before merging this PR."
              failed=1
            else
              echo "OK: $file (draft: ${draft_value:-not set})"
            fi
          done < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" |
              awk '/^content\/posts\/.*\/index(\.[^\/]+)?\.md$/'
          )

          if [[ "$checked" -eq 0 ]]; then
            echo "No changed post index files to check."
          fi

          exit "$failed"
