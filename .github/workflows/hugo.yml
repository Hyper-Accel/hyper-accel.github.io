# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install publication build dependency
        run: bun install --cwd scripts --frozen-lockfile --ignore-scripts
      - name: Test read-only publication build
        run: bun test ./scripts/build-publication.test.mjs
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with deployment-only publication dates
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_REPOSITORY: ${{ github.repository }}
          PUBLICATION_SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          bun scripts/build-publication.mjs build \
            --work-dir "${{ runner.temp }}/publication-build" \
            --repository "$PUBLICATION_REPOSITORY" \
            --site-url "$PUBLICATION_SITE" \
            --base-url "$PUBLICATION_SITE"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/publication-build/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout deployed source for read-back verification
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install publication build dependency
        run: bun install --cwd scripts --frozen-lockfile --ignore-scripts
      - name: Verify published state matches this deployment
        env:
          PUBLICATION_SITE: ${{ steps.deployment.outputs.page_url }}
          PUBLICATION_COMMIT: ${{ github.sha }}
        run: |
          bun scripts/build-publication.mjs verify \
            --site-url "$PUBLICATION_SITE" \
            --expected-commit "$PUBLICATION_COMMIT"
