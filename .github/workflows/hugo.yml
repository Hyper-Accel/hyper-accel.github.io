# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Queued runs must include date records written by the preceding run.
          ref: main
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication-date dependencies
        run: python -m pip install -r scripts/requirements-publication.txt
      - name: Test publication-date automation
        run: python -m unittest discover -s tests -p 'test_publication_dates.py' -v
      - name: Require previous successful deployments to have recorded dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_publication_recovery.py
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Set first-publication dates
        run: python scripts/publication_dates.py prepare --plan "${{ runner.temp }}/publication-plan.json"
      - name: Save publication plan for successful deployment and retries
        uses: actions/upload-artifact@v4
        with:
          name: publication-plan
          path: ${{ runner.temp }}/publication-plan.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Failed builds/deployments never change source dates. Workflow-level
  # concurrency also covers this job, so the next build sees its date records.
  record-publication:
    name: Record successful publication dates
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication-date dependencies
        run: python -m pip install -r scripts/requirements-publication.txt
      - name: Download publication plan
        uses: actions/download-artifact@v4
        with:
          name: publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Persist dates without overwriting concurrent changes
        run: bash scripts/record_publication_dates.sh "${{ runner.temp }}/publication-plan/publication-plan.json"
