<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" font-family="Inter, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" role="img"><title>A bucket weight is the sum of its child weights</title><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker></defs><rect width="720" height="200" rx="8" fill="#ffffff"/><text x="24" y="45" font-size="13" font-weight="600" text-anchor="start" fill="#6b7280">Parent bucket</text><text x="696" y="45" font-size="13" font-weight="400" text-anchor="end" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">= 2 + 2</text><text x="24" y="105" font-size="13" font-weight="600" text-anchor="start" fill="#6b7280">Child bucket</text><text x="696" y="105" font-size="13" font-weight="400" text-anchor="end" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">= 1 + 1</text><text x="24" y="172" font-size="13" font-weight="600" text-anchor="start" fill="#6b7280">Device</text><line x1="360" y1="40" x2="240" y2="100" stroke="#374151" stroke-width="1.4"/><line x1="360" y1="40" x2="480" y2="100" stroke="#374151" stroke-width="1.4"/><line x1="240" y1="100" x2="180" y2="150" stroke="#374151" stroke-width="1.4"/><line x1="240" y1="100" x2="300" y2="150" stroke="#374151" stroke-width="1.4"/><line x1="480" y1="100" x2="420" y2="150" stroke="#374151" stroke-width="1.4"/><line x1="480" y1="100" x2="540" y2="150" stroke="#374151" stroke-width="1.4"/><circle cx="360" cy="40" r="21" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="360" y="45" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">4</text><circle cx="240" cy="100" r="21" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="240" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">2</text><circle cx="480" cy="100" r="21" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/><text x="480" y="105" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">2</text><rect x="163" y="150" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="180" y="172" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><rect x="283" y="150" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="300" y="172" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><rect x="403" y="150" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="420" y="172" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937">1</text><rect x="523" y="150" width="34" height="34" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/><text x="540" y="172" font-size="15" font-weight="700" text-anchor="middle" fill="#1f293