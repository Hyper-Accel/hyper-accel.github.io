<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210" font-family="Inter, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" role="img"><title>Straw bucket</title><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker></defs><rect width="720" height="210" rx="8" fill="#ffffff"/><rect x="12" y="62" width="100" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="62.0" y="87.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">object x,</text><text x="62.0" y="105.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">replica r</text><text x="62.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">(e.g. x = "obj123",</text><text x="62.0" y="158" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">r = 0)</text><line x1="112" y1="90" x2="138" y2="90" stroke="#374151" stroke-width="1.6" marker-end="url(#a-dark)"/><rect x="140" y="50" width="186" height="80" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><text x="233" y="73" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">Score every item</text><text x="233" y="96" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937">s<tspan dy='3' font-size='9'>i</tspan><tspan dy='-3'> = ln(hash(x, r, i)) / w</tspan><tspan dy='3' font-size='9'>i</tspan></text><text x="233" y="118" font-size="11" font-weight="400" text-anchor="middle" fill="#6b7280">(straw2, hash ∈ (0, 1])</text><text x="233" y="152" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">Score every item → pick the max</text><text x="233" y="168" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">(all items compete independently)</text><line x1="326" y1="90" x2="380" y2="90" stroke="#374151" stroke-width="1.6" marker-end="url(#a-dark)"/><text x="353" y="70" font-size="10.5" font-weight="400" text-anchor="middle" fill="#6b7280">pick</text><text x="353" y="83" font-size="10.5" font-weight="400" text-anchor="middle" fill="#6b7280">max score</text><rect x="382" y="14" width="326" height="186" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/><text x="545" y="36" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f2937">Scores of all items (weight = 1, higher = longer straw)</text><rect x="467" y="46" width="76" height="148" rx="6" fill="#eff6ff" stroke="none" stroke-width="1.2"/><rect x="413.75" y="115.2" width="18" height="24.8" rx="2" fill="#9ca3af" stroke="none" stroke-width="1.2"/><text x="422.75" y="109.2" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">-1.17</text><text x="422.75" y="157" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">item A</text><text x="422.75" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#6b7280">(weight = 1)</text><rect x="495.25" y="70.4" width="18" height="69.6" rx="2" fill="#3b82f6" stroke="none" stroke-width="1.2"/><text x="504.25" y="64.4" font-size="12" font-weight="700" text-anchor="middle" fill="#1d4ed8">-0.14</text><text x="504.25" y="157" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">item B</text><text x="504.25" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#6b7280">(weight = 1)</text><rect x="576.75" y="98.4" width="18" height="41.6" rx="2" fill="#9ca3af" stroke="none" stroke-width="1.2"/><text x="585.75" y="92.4" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">-0.65</text><text x="585.75" y="157" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">item C</text><text x="585.75" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#6b7280">(weight = 1)</text><rect x="658.25" y="125.6" width="18" height="14.399999999999999" rx="2" fill="#9ca3af" stroke="none" stroke-width="1.2"/><text x="667.25" y="119.6" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">-1.71</text><text x="667.25" y="157" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">item D</text><text x="667.25" y="171" font-size="11" font-weight="400" text-anchor="middle" fill="#6b7280">(weight = 1)</text><line x1="394" y1="140" x2="696" y2="140" stroke="#d1d5db" stroke-width="1"/><rect x="475" y="178" width="60" height="16" rx="3" fill="#1d4ed8" stroke="none" stroke-width="1.2"/><text x="505" y="190" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">WINNER</text></svg>
