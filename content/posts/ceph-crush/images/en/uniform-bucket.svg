<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" font-family="Inter, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" role="img"><title>Uniform bucket</title><defs><marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#db2777"/></marker></defs><rect width="720" height="200" rx="8" fill="#ffffff"/><rect x="12" y="60" width="112" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="68.0" y="87.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">object x,</text><text x="68.0" y="105.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">replica r</text><text x="68.0" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">(e.g. x = "obj123",</text><text x="68.0" y="158" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">r = 0)</text><line x1="124" y1="90" x2="158" y2="90" stroke="#374151" stroke-width="1.6" marker-end="url(#a-dark)"/><rect x="160" y="60" width="150" height="60" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.4"/><text x="235" y="85" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">hash / modulo</text><text x="235" y="105" font-size="13" font-weight="400" text-anchor="middle" fill="#1f2937" font-family="SFMono-Regular, Menlo, Consolas, monospace">c(r, x)</text><text x="235" y="142" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">index = hash(x, r) mod m</text><text x="235" y="158" font-size="11.5" font-weight="400" text-anchor="middle" fill="#6b7280">(m = number of items)</text><line x1="310" y1="90" x2="364" y2="90" stroke="#374151" stroke-width="1.6" marker-end="url(#a-dark)"/><text x="337" y="82" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280">index</text><rect x="366" y="30" width="342" height="156" rx="10" fill="#fafafa" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/><text x="537" y="52" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1f2937"><tspan font-weight='700'>Uniform bucket</tspan> (m = 4, all item weights = 1)</text><rect x="372" y="66" width="76" height="110" rx="6" fill="#dbeafe" stroke="none" stroke-width="1.2"/><path d="M385.75,83.82 V108.18 A23.0,7.82 0 0 0 431.75,108.18 V83.82 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.4"/><ellipse cx="408.75" cy="83.82" rx="23.0" ry="7.82" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.4"/><text x="408.75" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">item A</text><text x="408.75" y="158" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280">weight = 1</text><path d="M471.25,83.82 V108.18 A23.0,7.82 0 0 0 517.25,108.18 V83.82 Z" fill="#d1d5db" stroke="#6b7280" stroke-width="1.4"/><ellipse cx="494.25" cy="83.82" rx="2