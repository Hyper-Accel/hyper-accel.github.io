<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="cmp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="#FFFFFF"/>

  <!-- 블록 레벨 -->
  <rect x="20" y="20" width="1160" height="290" rx="16" fill="#F4F6FA" stroke="#D5DBE6"/>
  <text x="44" y="58" font-size="22" font-weight="700" fill="#222">Block level</text>
  <text x="182" y="58" font-size="18" fill="#555">Ground truth = spec document</text>

  <rect x="60" y="140" width="230" height="84" rx="10" fill="#FDF1DC" stroke="#C98A1B" stroke-width="2"/>
  <text x="175" y="177" font-size="22" font-weight="700" text-anchor="middle" fill="#222">Spec document</text>
  <text x="175" y="205" font-size="16" text-anchor="middle" fill="#555">Written by designers</text>

  <rect x="430" y="70" width="250" height="76" rx="10" fill="#E3ECF9" stroke="#3B6FB6" stroke-width="2"/>
  <text x="555" y="103" font-size="22" font-weight="700" text-anchor="middle" fill="#222">Block RTL</text>
  <text x="555" y="129" font-size="16" text-anchor="middle" fill="#555">Built by design team</text>

  <rect x="430" y="222" width="250" height="76" rx="10" fill="#E2F3E7" stroke="#2E8B57" stroke-width="2"/>
  <text x="555" y="255" font-size="22" font-weight="700" text-anchor="middle" fill="#222">Reference model</text>
  <text x="555" y="281" font-size="16" text-anchor="middle" fill="#555">Built by verification team</text>

  <path d="M290,168 C360,150 370,108 428,108" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M290,196 C360,214 370,260 428,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="555" y1="150" x2="555" y2="218" stroke="#C0392B" stroke-width="3" marker-start="url(#cmp)" marker-end="url(#cmp)"/>
  <line x1="690" y1="184" x2="735" y2="184" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="745" y="168" font-size="20" font-weight="700" fill="#C0392B">Comparison ① · bit-exact</text>
  <text x="745" y="198" font-size="17" fill="#333">Catches: deviations from the spec</text>
  <text x="745" y="226" font-size="17" fill="#777">Misses: errors in the spec itself</text>

  <!-- Top 레벨 -->
  <rect x="20" y="330" width="1160" height="530" rx="16" fill="#F7F4FA" stroke="#DDD5E6"/>
  <text x="44" y="368" font-size="22" font-weight="700" fill="#222">Top level</text>
  <text x="162" y="368" font-size="18" fill="#555">Ground truth = AI model output (HF golden)</text>
  <text x="44" y="398" font-size="15" fill="#777">fsim and the RTL on ZeBu run the same compiler (Legato) output</text>

  <rect x="60" y="425" width="240" height="76" rx="10" fill="#EEE6F7" stroke="#7D4BB3" stroke-width="2"/>
  <text x="180.0" y="458" font-size="21" font-weight="700" text-anchor="middle" fill="#222">HF model (CPU)</text>
  <text x="180.0" y="485" font-size="15" text-anchor="middle" fill="#555">golden</text>
  <rect x="450" y="425" width="240" height="76" rx="10" fill="#EEEEEE" stroke="#777" stroke-width="2"/>
  <text x="570.0" y="458" font-size="21" font-weight="700" text-anchor="middle" fill="#222">fsim · torch mode</text>
  <text x="570.0" y="485" font-size="15" text-anchor="middle" fill="#555">Simulator team</text>
  <line x1="306" y1="463" x2="444" y2="463" stroke="#C0392B" stroke-width="3" marker-start="url(#cmp)" marker-end="url(#cmp)"/>
  <text x="375" y="445" font-size="18" font-weight="700" text-anchor="middle" fill="#C0392B">③ tolerance</text>
  <text x="390" y="467" font-size="14" text-anchor="middle" fill="#555"></text>
  <text x="375" y="492" font-size="14" text-anchor="middle" fill="#555">fast check</text>

  <rect x="60" y="565" width="240" height="76" rx="10" fill="#EEE6F7" stroke="#7D4BB3" stroke-width="2"/>
  <text x="180.0" y="598" font-size="21" font-weight="700" text-anchor="middle" fill="#222">HF model (GPU)</text>
  <text x="180.0" y="625" font-size="15" text-anchor="middle" fill="#555">golden · closer to the chip</text>
  <rect x="450" y="565" width="240" height="76" rx="10" fill="#EEEEEE" stroke="#777" stroke-width="2"/>
  <text x="570.0" y="598" font-size="21" font-weight="700" text-anchor="middle" fill="#222">fsim · rtl mode</text>
  <text x="570.0" y="625" font-size="15" text-anchor="middle" fill="#555">Simulator team · cmodel</text>
  <rect x="900" y="565" width="240" height="76" rx="10" fill="#E3ECF9" stroke="#3B6FB6" stroke-width="2"/>
  <text x="1020.0" y="598" font-size="21" font-weight="700" text-anchor="middle" fill="#222">RTL (ZeBu)</text>
  <text x="1020.0" y="625" font-size="15" text-anchor="middle" fill="#555">Runs on an emulator</text>
  <line x1="306" y1="603" x2="444" y2="603" stroke="#C0392B" stroke-width="3" marker-start="url(#cmp)" marker-end="url(#cmp)"/>
  <text x="375" y="585" font-size="18" font-weight="700" text-anchor="middle" fill="#C0392B">④ tolerance</text>
  <text x="375" y="632" font-size="14" text-anchor="middle" fill="#555">validates rtl mode</text>
  <line x1="696" y1="603" x2="894" y2="603" stroke="#C0392B" stroke-width="3" marker-start="url(#cmp)" marker-end="url(#cmp)"/>
  <text x="795" y="585" font-size="18" font-weight="700" text-anchor="middle" fill="#C0392B">⑤ bit-exact</text>
  <text x="795" y="632" font-size="14" text-anchor="middle" fill="#555">output tokens · DRAM dump</text>

  <rect x="900" y="705" width="240" height="76" rx="10" fill="#E3ECF9" stroke="#3B6FB6" stroke-width="2"/>
  <text x="1020.0" y="738" font-size="21" font-weight="700" text-anchor="middle" fill="#222">Top RTL</text>
  <text x="1020.0" y="765" font-size="15" text-anchor="middle" fill="#555">Top-level simulation</text>
  <line x1="660" y1="646" x2="896" y2="740" stroke="#C0392B" stroke-width="3" marker-start="url(#cmp)" marker-end="url(#cmp)"/>
  <text x="740" y="752" font-size="18" font-weight="700" text-anchor="end" fill="#C0392B">② bit-exact</text>
  <text x="740" y="774" font-size="14" text-anchor="end" fill="#555">verification team scenarios</text>

  <text x="600" y="836" font-size="15" text-anchor="middle" fill="#777">Principle: change only one thing per comparison where possible. ⑤ changes only the executor; ③ and ④ change both the compiler and fsim.</text>
</svg>
