<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1000 620" role="img" aria-labelledby="title desc">
<title id="title">map이 만든 바깥 some을 join이 제거합니다</title><desc id="desc">some b에 map g를 적용하면 g b라는 Option C 결과를 바깥 some이 감싼다. join은 바깥 some을 제거해 g b를 남긴다. 입력 none은 두 단계 모두 none이다. g b가 none인 경우에도 some none은 join 뒤 none이 된다.</desc>
