<text x="488" y="221" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26">g b</text>
<rect x="744" y="165" width="212" height="95" rx="6" fill="#fff2df" stroke="#b6833f" stroke-width="2"/>
<text x="850" y="221" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="26">g b</text>
