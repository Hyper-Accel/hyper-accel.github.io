<g font-size="23" text-anchor="middle"><text x="288" y="187">map g</text><text x="684" y="187">join</text></g>
<g font-family="ui-monospace, Menlo, monospace" font-size="25" text-anchor="middle"><text x="135" y="348">none</text><text x="488" y="348">none</text><text x="850" y="348">none</text></g>
