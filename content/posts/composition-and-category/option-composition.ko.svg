<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 692" width="600" height="692" role="img" aria-labelledby="title desc">
<title id="title">Option 도입 전후의 함수 연결</title><desc id="desc">Previously Employee passed directly to managerOf. With Option Employee, some employee continues to managerOf; none stops and returns none.</desc>
<style>text{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;fill:#20252b;font-size:22px}.label{font-size:23px;font-weight:600}.code{font-family:ui-monospace,monospace;font-size:21px}.muted{fill:#52606d;font-size:20px}.box{fill:#fff;stroke:#a9b4bf;stroke-width:1.5}.group{fill:#eef4fb;stroke:#386ba2;stroke-width:2}.line{fill:none;stroke:#52606d;stroke-width:2;marker-end:url(#end)}</style>
<defs><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52606d"/></marker></defs>
<rect width="600" height="692" rx="12" fill="#f8fafc"/><text x="24" y="40" class="label" text-anchor="start">처음: 반환값을 그대로 전달</text><rect class="box" x="24" y="60" width="552" height="54" rx="6"/><text x="300" y="94" class="code" text-anchor="middle">findEmployee : Nat → Employee</text><path class="line" d="M300 118v62"/><text x="320" y="157" class="code" text-anchor="start">Employee</text><rect class="box" x="24" y="188" width="552" height="54" rx="6"/><text x="300" y="222" class="code" text-anchor="middle">managerOf : Employee → Employee</text><text x="24" y="295" class="label" text-anchor="start">변경 후: 부재를 처리하는 단계가 필요</text><rect class="box" x="24" y="315" width="552" height="54" rx="6"/><text x="300" y="349" class="code" text-anchor="middle">findEmployee : Nat → Option Employee</text><path class="line" d="M300 373v37"/><rect x="24" y="418" width="552" height="114" rx="8" fill="#fff5e8" stroke="#946223" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300" y="454" class="code" text-anchor="middle">some employee → employee 전달</text><text x="300" y="493" class="code" text-anchor="middle">none → 조회를 멈추고 none 반환</text><path class="line" d="M300 536v37"/><text x="320" y="562" class="code" text-anchor="start">Employee</text><rect class="box" x="24" y="581" width="552" height="54" rx="6"/><text x="300" y="615" class="code" text-anchor="middle">managerOf : Employee → Option Employee</text><text x="300" y="666" class="muted" text-anchor="middle">다음 조회는 값이 있을 때만 진행합니다.</text></svg>