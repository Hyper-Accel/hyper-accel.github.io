<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">같은 함수를 두 범주의 화살표로 읽기</title>
<desc id="desc">같은 함수 f의 타입은 A에서 Option B입니다. 위 Type 범주에서는 Option B가 도착 대상이고, 아래 Option의 Kleisli 범주에서는 B가 도착 대상입니다. 두 줄 사이의 선은 함수의 변환을 나타내지 않습니다.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102634"/><stop offset="1" stop-color="#213f50"/></linearGradient>
  <linearGradient id="face" x2="1" y2="1"><stop stop-color="#426d80"/><stop offset="1" stop-color="#224858"/></linearGradient>
  <linearGradient id="gold" x2="1"><stop stop-color="#c89751"/><stop offset=".5" stop-color="#ffe0a0"/><stop offset="1" stop-color="#d9ad68"/></linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b7d9e4" stroke-opacity=".055"/></pattern>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#061823" flood-opacity=".55"/></filter>
</defs>
<rect width="1200" height="550" fill="url(#bg)"/><rect width="1200" height="550" fill="url(#grid)"/>
<path d="M105 276H1095" stroke="#91b0bc" stroke-opacity=".25" stroke-width="2" stroke-dasharray="9 12"/>
<g font-family="system-ui,-apple-system,sans-serif" font-size="30" fill="#e6c286"><text x="122" y="76">Type</text><text x="122" y="348">Kleisli</text></g>
<g filter="url(#shadow)">
  <path d="M247 135 281 114H427L393 135Z M754 135 788 114H1080L1046 135Z M247 397 281 376H427L393 397Z M835 397 869 376H1015L981 397Z" fill="#527f91"/>
  <path d="M393 135 427 114V229L393 250Z M1046 135 1080 114V229L1046 250Z M393 397 427 376V491L393 512Z M981 397 1015 376V491L981 512Z" fill="#193b4c"/>
  <g fill="url(#face)" stroke="#82afbf" stroke-width="2"><rect x="247" y="135" width="146" height="115" rx="6"/><rect x="754" y="135" width="292" height="115" rx="6"/><rect x="247" y="397" width="146" height="115" rx="6"/><rect x="835" y="397" width="146" height="115" rx="6"/></g>
</g>
<g font-family="system-ui,-apple-system,sans-serif" text-anchor="middle" fill="#eff7fa" font-size="43"><text x="320" y="210">A</text><text x="900" y="210">Option B</text><text x="320" y="472">A</text><text x="908" y="472">B</text></g>
<g fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M445 191H718m-18-15 18 15-18 15 M445 453H800m-18-15 18 15-18 15"/></g>
<g font-family="Georgia,serif" font-style="italic" text-anchor="middle" font-size="42" fill="#fff0c5"><text x="582" y="172">f</text><text x="620" y="434">f</text></g>
</svg>
