<header class="tr-header">
  <div class="tr-header-in">
    <a class="tr-brand" href="{{ "" | relLangURL }}"><img src="{{ "/images/logo-transparent.png" | relURL }}" alt="" width="28" height="28"><span>HyperAccel <b>Tech Blog</b></span></a>
    <nav class="tr-nav" aria-label="{{ if eq site.Language.Lang "ko" }}카테고리{{ else }}Categories{{ end }}">
      {{- range (site.GetPage "/categories").Pages }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{- end }}
    </nav>
    <div class="tr-tools">
      <a class="tr-pill tr-pill-careers" href="https://hyperaccel.career.greetinghr.com/{{ cond (eq site.Language.Lang "ko") "ko" "en" }}/guide" target="_blank" rel="noopener">{{ if eq site.Language.Lang "ko" }}채용{{ else }}Careers{{ end }} ↗</a>
      {{- with site.Home.Translations }}{{ range . }}{{ if ne .Lang site.Language.Lang }}<a class="tr-pill" href="{{ .Permalink }}">{{ .Language.LanguageName }}</a>{{ end }}{{ end }}{{ end }}
    </div>
  </div>
</header>
